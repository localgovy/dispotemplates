<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // spa-github-pages redirect for /dispotemplates/<app>/<route>
      // pathSegmentsToKeep = 2 → /dispotemplates/amber-reserve/?/home
      (function () {
        var pathSegmentsToKeep = 2;
        var l = window.location;
        var segs = l.pathname.split("/").filter(Boolean);
        // Need repo + app + at least one route segment
        if (segs.length <= pathSegmentsToKeep) return;
        if (segs[segs.length - 1] === "404.html") return;

        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            "/" +
            segs.slice(0, pathSegmentsToKeep).join("/") +
            "/?/" +
            segs
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search
              ? "&" + l.search.slice(1).replace(/&/g, "~and~")
              : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
