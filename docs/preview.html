<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo preview · LocalGovy</title>
  <meta name="description" content="Mobile phone-frame preview of a LocalGovy dispensary template demo." />
  <style>
    :root {
      --bg: #0c100e;
      --panel: #141b17;
      --text: #f4f1ea;
      --muted: #9aa89f;
      --line: rgba(255,255,255,0.08);
      --accent: #7dcea0;
      --bezel: #1a1d1b;
      --bezel-edge: #2a312c;
      --screen: #000;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(800px 420px at 15% 0%, rgba(125,206,160,0.16), transparent 55%),
        radial-gradient(700px 380px at 90% 10%, rgba(240,198,116,0.1), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100%;
    }
    .shell {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .brand .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .actions a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .actions a:hover {
      border-color: rgba(125,206,160,0.45);
      background: rgba(125,206,160,0.1);
    }
    .actions a.primary {
      background: var(--accent);
      color: #0c1510;
      border-color: transparent;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 16px 40px;
    }
    .phone {
      width: min(390px, calc(100vw - 32px));
      aspect-ratio: 390 / 844;
      max-height: calc(100vh - 150px);
      background: linear-gradient(160deg, #2a2f2c, #121412 40%, #0a0c0b);
      border-radius: 42px;
      /* Extra top padding keeps the Dynamic Island in the bezel, not over the app header */
      padding: 36px 12px 16px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 28%;
      height: 22px;
      background: #050605;
      border-radius: 999px;
      z-index: 2;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      pointer-events: none;
    }
    .screen {
      width: 100%;
      height: 100%;
      /* Concentric with .phone radius 42 − side padding 12 */
      border-radius: 30px;
      overflow: hidden;
      background: var(--screen);
      position: relative;
      display: flex;
      flex-direction: column;
      /* Seal subpixel hairlines at the bezel/screen join */
      box-shadow: 0 0 0 1px #0a0c0b;
    }
    /* Fake status-bar inset so tall serif wordmarks aren’t clipped at y=0 */
    .screen-inset {
      height: 28px;
      flex-shrink: 0;
      background: #0d0d0d;
    }
    .screen iframe {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      display: block;
      background: #000;
    }
    .loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #0a0c0b;
      color: var(--muted);
      font-size: 0.9rem;
      transition: opacity 0.25s ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(125,206,160,0.2);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      text-align: center;
    }
    .error p { color: var(--muted); line-height: 1.5; }
    .hint {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
      text-align: center;
      padding: 0 12px;
    }

    /* On real phones: drop the bezel, full-bleed demo */
    @media (max-width: 520px) {
      .topbar { padding: 12px 14px; }
      .stage { padding: 0; align-items: stretch; }
      .phone {
        width: 100%;
        max-height: none;
        height: calc(100vh - 57px);
        aspect-ratio: auto;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .phone::before { display: none; }
      .screen { border-radius: 0; }
      .hint { display: none; }
      .actions a:not(.primary) { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">LocalGovy · Mobile preview</span>
        <h1 id="title">Loading…</h1>
      </div>
      <div class="actions">
        <a href="./">All templates</a>
        <a class="primary" id="fullscreen" href="#">Open full screen</a>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="phone" id="phone">
        <div class="screen">
          <div class="screen-inset" aria-hidden="true"></div>
          <div class="loading" id="loading">
            <div class="spinner" aria-hidden="true"></div>
            <span>Loading demo…</span>
          </div>
          <iframe
            id="frame"
            title="Template demo"
            allow="clipboard-read; clipboard-write"
            loading="eager"
          ></iframe>
        </div>
      </div>
      <div class="hint">Scroll inside the phone</div>
    </main>
  </div>

  <script>
    (function () {
      var APPS = {
        "amber-reserve": "Amber Reserve",
        "obsidian-glow": "Obsidian Lab",
        "rose-noir": "Rose Noir",
        "ethereal-ghost": "Ghost Atelier",
        "emerald-crypt": "Emerald Crypt",
        "nebula-clinic": "Nebula Clinic",
        "luminous-botanical": "Luminous Botanical",
        "citrus-grove": "Citrus Grove",
        "azure-bloom": "Azure Bloom"
      };

      var params = new URLSearchParams(window.location.search);
      var app = params.get("app") || "";
      var bust = params.get("v") || String(Date.now());
      var titleEl = document.getElementById("title");
      var frame = document.getElementById("frame");
      var full = document.getElementById("fullscreen");
      var stage = document.getElementById("stage");

      if (!APPS[app]) {
        stage.innerHTML =
          '<div class="error"><h2>Unknown demo</h2><p>Pick a template from the hub.</p><p><a href="./" style="color:#7dcea0">Back to templates</a></p></div>';
        titleEl.textContent = "Demo not found";
        full.style.display = "none";
        return;
      }

      var src = "./" + app + "/";
      var framed = src + "?vb=" + encodeURIComponent(bust);
      titleEl.textContent = APPS[app];
      document.title = APPS[app] + " · Mobile preview";
      full.href = src;
      frame.src = framed;

      var loading = document.getElementById("loading");
      var hideLoading = function () {
        if (loading) loading.classList.add("hidden");
      };
      frame.addEventListener("load", function () {
        // Expo demos need a beat after the shell loads
        setTimeout(hideLoading, 900);
      });
      setTimeout(hideLoading, 8000);
    })();
  </script>
</body>
</html>
