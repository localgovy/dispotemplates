<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo preview · LocalGovy</title>
  <meta name="description" content="Mobile phone-frame preview of a LocalGovy dispensary template demo." />
  <style>
    :root {
      --bg: #0c100e;
      --panel: #141b17;
      --text: #f4f1ea;
      --muted: #9aa89f;
      --line: rgba(255,255,255,0.08);
      --accent: #7dcea0;
      --bezel: #1a1d1b;
      --bezel-edge: #2a312c;
      --screen: #000;
      --status-fg: #f5f5f5;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      font-family: "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(800px 420px at 15% 0%, rgba(125,206,160,0.16), transparent 55%),
        radial-gradient(700px 380px at 90% 10%, rgba(240,198,116,0.1), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100%;
    }
    .shell {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .brand .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .actions a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .actions a:hover {
      border-color: rgba(125,206,160,0.45);
      background: rgba(125,206,160,0.1);
    }
    .actions a.primary {
      background: var(--accent);
      color: #0c1510;
      border-color: transparent;
    }
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 28px 16px 40px;
    }
    .phone {
      width: min(390px, calc(100vw - 32px));
      aspect-ratio: 390 / 844;
      max-height: calc(100vh - 150px);
      background: linear-gradient(160deg, #2a2f2c, #121412 40%, #0a0c0b);
      border-radius: 42px;
      /* Even bezel — island sits over the screen like a real device */
      padding: 12px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 30px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 112px;
      height: 32px;
      background: #050605;
      border-radius: 999px;
      z-index: 5;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      pointer-events: none;
    }
    .screen {
      width: 100%;
      height: 100%;
      /* Concentric with .phone radius 42 − side padding 12 */
      border-radius: 30px;
      overflow: hidden;
      background: var(--screen);
      position: relative;
      display: flex;
      flex-direction: column;
      /* Seal subpixel hairlines at the bezel/screen join */
      box-shadow: 0 0 0 1px #0a0c0b;
    }
    /*
      Real-phone top: status chrome matches the app canvas, content starts
      below the island so headers aren’t clipped.
    */
    .status-bar {
      flex-shrink: 0;
      height: 50px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 22px 10px;
      background: var(--screen);
      color: var(--status-fg);
      font-family: "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      position: relative;
      z-index: 4;
      user-select: none;
      pointer-events: none;
    }
    .status-bar .time {
      min-width: 54px;
      padding-left: 4px;
    }
    .status-bar .icons {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 54px;
      justify-content: flex-end;
      padding-right: 2px;
    }
    .status-bar .icons svg {
      display: block;
      fill: currentColor;
    }
    .screen iframe {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      display: block;
      background: var(--screen);
    }
    .loading {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: var(--screen);
      color: var(--muted);
      font-size: 0.9rem;
      transition: opacity 0.25s ease;
    }
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(125,206,160,0.2);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      max-width: 420px;
      margin: 0 auto;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      text-align: center;
    }
    .error p { color: var(--muted); line-height: 1.5; }
    .hint {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
      text-align: center;
      padding: 0 12px;
    }

    /* On real phones: drop the bezel, full-bleed demo */
    @media (max-width: 520px) {
      .topbar { padding: 12px 14px; }
      .stage { padding: 0; align-items: stretch; }
      .phone {
        width: 100%;
        max-height: none;
        height: calc(100vh - 57px);
        aspect-ratio: auto;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }
      .phone::before { display: none; }
      .status-bar { display: none; }
      .screen { border-radius: 0; }
      .hint { display: none; }
      .actions a:not(.primary) { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow">LocalGovy · Mobile preview</span>
        <h1 id="title">Loading…</h1>
      </div>
      <div class="actions">
        <a href="./">All templates</a>
        <a class="primary" id="fullscreen" href="#">Open full screen</a>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="phone" id="phone">
        <div class="screen">
          <div class="status-bar" id="status-bar" aria-hidden="true">
            <span class="time">9:41</span>
            <div class="icons">
              <!-- Cellular -->
              <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true">
                <rect x="0" y="8" width="3" height="4" rx="0.6"></rect>
                <rect x="4.5" y="5" width="3" height="7" rx="0.6"></rect>
                <rect x="9" y="2.5" width="3" height="9.5" rx="0.6"></rect>
                <rect x="13.5" y="0" width="3" height="12" rx="0.6"></rect>
              </svg>
              <!-- Wi‑Fi -->
              <svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true">
                <path d="M8 9.6a1.4 1.4 0 1 1 0 2.8 1.4 1.4 0 0 1 0-2.8Zm0-3.5c1.7 0 3.2.7 4.3 1.7l-1.3 1.3A4.1 4.1 0 0 0 8 8.1c-1.1 0-2.1.4-2.9 1L3.8 7.8A6 6 0 0 1 8 6.1Zm0-3.5c2.7 0 5.1 1.1 6.9 2.8L13.6 6.7A7.7 7.7 0 0 0 8 4.4c-2.1 0-4 .8-5.5 2.2L1.2 5.3A9.9 9.9 0 0 1 8 2.6Z"></path>
              </svg>
              <!-- Battery -->
              <svg width="27" height="13" viewBox="0 0 27 13" aria-hidden="true">
                <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"></rect>
                <rect x="2" y="2" width="18" height="9" rx="2"></rect>
                <path d="M25 4.5v4a2 2 0 0 0 0-4Z" fill="currentColor" fill-opacity="0.45"></path>
              </svg>
            </div>
          </div>
          <div class="loading" id="loading">
            <div class="spinner" aria-hidden="true"></div>
            <span>Loading demo…</span>
          </div>
          <iframe
            id="frame"
            title="Template demo"
            allow="clipboard-read; clipboard-write"
            loading="eager"
          ></iframe>
        </div>
      </div>
      <div class="hint">Scroll inside the phone</div>
    </main>
  </div>

  <script>
    (function () {
      var APPS = {
        "amber-reserve": { name: "Amber Reserve", screen: "#131411", light: false },
        "obsidian-glow": { name: "Obsidian Lab", screen: "#0d0d0d", light: false },
        "rose-noir": { name: "Rose Noir", screen: "#0a0a0a", light: false },
        "ethereal-ghost": { name: "Ghost Atelier", screen: "#121212", light: false },
        "emerald-crypt": { name: "Emerald Crypt", screen: "#131313", light: false },
        "nebula-clinic": { name: "Nebula Clinic", screen: "#f8f9ff", light: true },
        "luminous-botanical": { name: "Luminous Botanical", screen: "#faf9f7", light: true },
        "citrus-grove": { name: "Citrus Grove", screen: "#FFF8F0", light: true },
        "azure-bloom": { name: "Azure Bloom", screen: "#F0F6FF", light: true }
      };

      var params = new URLSearchParams(window.location.search);
      var app = params.get("app") || "";
      var bust = params.get("v") || String(Date.now());
      var titleEl = document.getElementById("title");
      var frame = document.getElementById("frame");
      var full = document.getElementById("fullscreen");
      var stage = document.getElementById("stage");
      var root = document.documentElement;

      if (!APPS[app]) {
        stage.innerHTML =
          '<div class="error"><h2>Unknown demo</h2><p>Pick a template from the hub.</p><p><a href="./" style="color:#7dcea0">Back to templates</a></p></div>';
        titleEl.textContent = "Demo not found";
        full.style.display = "none";
        return;
      }

      var meta = APPS[app];
      root.style.setProperty("--screen", meta.screen);
      root.style.setProperty("--status-fg", meta.light ? "#111111" : "#f5f5f5");

      var src = "./" + app + "/";
      var framed = src + "?vb=" + encodeURIComponent(bust);
      titleEl.textContent = meta.name;
      document.title = meta.name + " · Mobile preview";
      full.href = src;
      frame.src = framed;

      var loading = document.getElementById("loading");
      var hideLoading = function () {
        if (loading) loading.classList.add("hidden");
      };
      frame.addEventListener("load", function () {
        // Expo demos need a beat after the shell loads
        setTimeout(hideLoading, 900);
      });
      setTimeout(hideLoading, 8000);
    })();
  </script>
</body>
</html>
